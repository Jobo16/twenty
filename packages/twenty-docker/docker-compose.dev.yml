# Development infrastructure services only (Postgres + Redis).
# Use this when developing locally against the source code.
#
# The project name is SCRM-specific so this stack stays separate from other
# Compose projects on the same machine.
#
# Both images are overridable so a team can point them at an approved private
# registry or cache. See .env.scrm.example; defaults match the official images.
#
# Usage (from the repository root):
#   ./scripts/scrm/yarn scrm:dev      # start infrastructure, then run the apps
#   ./scripts/scrm/yarn scrm:stop     # stop
#   ./scripts/scrm/compose down -v    # stop + wipe local data

name: scrm-dev

services:
  db:
    image: "${SCRM_POSTGRES_IMAGE:-postgres:16}"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default
    healthcheck:
      test: pg_isready -U postgres -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: "${SCRM_REDIS_IMAGE:-redis:7}"
    ports:
      - "6379:6379"
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  dev-db-data:
